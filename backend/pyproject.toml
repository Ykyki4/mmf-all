[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = [
    "B008",   # Depends() в аргументах по умолчанию — стандартный паттерн FastAPI
    "S311",   # random в сидере/заглушках не используется для криптографии
    "E712",   # сравнение с True/False в выражениях SQLAlchemy
    "UP046",  # Generic-классы Pydantic оставлены в классической форме
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"seed_data.py" = ["S105", "S106"]
"create_user.py" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
